[project]
name = "evaluation-judger"
version = "0.1.0"
description = "Evidence based AI agent evaluation with OpenCode"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "json-repair>=0.44", "openpyxl>=3.1", "pypdf>=5", "python-docx>=1.1", "python-pptx>=1.0"]

[project.scripts]
evaluation-judger = "evaluation_judger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
