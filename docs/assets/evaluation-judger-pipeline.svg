<path d="M1360,430 V349" class="retry"/>
<text x="1234" y="386" class="legend" text-anchor="end">逐题 × 逐对象</text>
<text x="1377" y="386" font-size="14" fill="#a36c23">修复</text>
<rect x="48" y="955" width="672" height="86" rx="7" fill="#f8fafc" stroke="#dbe2eb"/>
<rect x="760" y="955" width="672" height="86" rx="7" fill="#f8fafc" stroke="#dbe2eb"/>
<text x="68" y="982" class="phase">独立记录归档</text>
<text x="68" y="1007" class="body">受测对象测试 Excel 与评测程序日志分别留存。</text>
<text x="68" y="1030" class="body">用于追溯，不进入维度总评或最终报告。</text>
<text x="780" y="982" class="phase">容错与续跑</text>
<text x="780" y="1007" class="body">保留有效检查点，失败项不阻断其他题目；续跑只补缺项。</text>
<text x="780" y="1030" class="body">复用完成结果前，核对输入指纹和判分一致性。</text>
<text x="48" y="1082" class="subtitle">图 1. 模型负责证据判断与报告文字，程序负责验证、算分和汇总；一次运行处理一个数据集。</text>
</svg>